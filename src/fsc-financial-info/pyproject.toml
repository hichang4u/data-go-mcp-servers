[project]
name = "data-go-mcp.fsc-financial-info"
version = "0.4.0"
description = "MCP server for Korea FSC Corporate Financial Information API (금융위원회 기업 재무정보)"
readme = "README.md"
authors = [{ name = "Your Name", email = "your.email@example.com" }]
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = ["mcp", "llm", "data.go.kr", "korea", "openapi", "financial", "corporate", "fsc"]

dependencies = [
    "data-go-mcp-core",
    "httpx>=0.28",
    "mcp[cli]>=2.2,<3",
    "pydantic>=2.11",
    "python-dotenv>=1.1",
]

[project.urls]
Homepage = "https://github.com/hichang4u/data-go-mcp-servers"
Repository = "https://github.com/hichang4u/data-go-mcp-servers"
Documentation = "https://github.com/hichang4u/data-go-mcp-servers#fsc-financial-info"
Issues = "https://github.com/hichang4u/data-go-mcp-servers/issues"

[project.scripts]
"data-go-mcp.fsc-financial-info" = "data_go_mcp.fsc_financial_info.server:main"

[tool.uv.sources]
data-go-mcp-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_go_mcp"]


[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
