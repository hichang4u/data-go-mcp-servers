[project]
name = "data-go-mcp.all-servers"
version = "0.1.0"
description = "All data.go.kr + OpenDART MCP servers in one process (for Smithery / MCPB distribution)"
readme = "README.md"
authors = [
    { name = "Data.go.kr MCP Servers Contributors" },
    { name = "hichang4u" },
]
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
keywords = ["mcp", "korea", "api", "data.go.kr", "opendart"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
# 서버를 추가하면 여기에도 넣는다 — uvx 는 선언된 의존성만 설치한다 (tests/test_server.py 가 검사)
dependencies = [
    "data-go-mcp-core",
    "data-go-mcp.dart-disclosure",
    "data-go-mcp.fsc-financial-info",
    "data-go-mcp.msds-chemical-info",
    "data-go-mcp.nps-business-enrollment",
    "data-go-mcp.nts-business-verification",
    "data-go-mcp.pps-narajangteo",
    "data-go-mcp.presidential-speeches",
    "mcp[cli]>=2.2,<3",
]

[project.urls]
Homepage = "https://github.com/hichang4u/data-go-mcp-servers"
Repository = "https://github.com/hichang4u/data-go-mcp-servers"
Documentation = "https://github.com/hichang4u/data-go-mcp-servers/tree/main/src/all-servers"
"Bug Tracker" = "https://github.com/hichang4u/data-go-mcp-servers/issues"

[project.scripts]
"data-go-mcp.all-servers" = "data_go_mcp.all_servers.server:main"

[tool.uv.sources]
data-go-mcp-core = { workspace = true }
"data-go-mcp.dart-disclosure" = { workspace = true }
"data-go-mcp.fsc-financial-info" = { workspace = true }
"data-go-mcp.msds-chemical-info" = { workspace = true }
"data-go-mcp.nps-business-enrollment" = { workspace = true }
"data-go-mcp.nts-business-verification" = { workspace = true }
"data-go-mcp.pps-narajangteo" = { workspace = true }
"data-go-mcp.presidential-speeches" = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_go_mcp"]
