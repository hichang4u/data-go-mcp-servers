[project]
name = "data-go-mcp-core"
version = "0.1.0"
description = "Shared client, error and key-loading utilities for data-go-mcp servers"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
    "httpx>=0.28",
    "mcp[cli]>=2.2,<3",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
xml = ["xmltodict>=0.14"]

[project.urls]
Repository = "https://github.com/hichang4u/data-go-mcp-servers"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data_go_mcp"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1.1", "respx>=0.22"]
