# uv run pre-commit install
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        exclude: ^template/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        exclude: ^template/
      - id: pyright
        name: pyright
        entry: uv run pyright src scripts tests
        language: system
        pass_filenames: false
        files: \.py$
